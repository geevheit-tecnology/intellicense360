services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: geevheit_intelligence
      POSTGRES_USER: geevheit
      POSTGRES_PASSWORD: geevheit_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nats:
    image: nats:2-alpine
    ports:
      - "4222:4222"

volumes:
  postgres_data:

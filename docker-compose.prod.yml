services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geevheit_intelligence_prod}
      POSTGRES_USER: ${POSTGRES_USER:-geevheit_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geevheit_prod_secret_pass_123!}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geevheit_admin} -d ${POSTGRES_DB:-geevheit_intelligence_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geevheit_prod_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    networks:
      - geevheit_prod_net

  migrate:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    entrypoint: ["/app/migrate", "up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-geevheit_admin}:${POSTGRES_PASSWORD:-geevheit_prod_secret_pass_123!}@postgres:5432/${POSTGRES_DB:-geevheit_intelligence_prod}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - geevheit_prod_net
    restart: "no"

  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-geevheit_admin}:${POSTGRES_PASSWORD:-geevheit_prod_secret_pass_123!}@postgres:5432/${POSTGRES_DB:-geevheit_intelligence_prod}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-substituir_por_chave_criptografica_forte_minimo_64_caracteres_aleatorios}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - geevheit_prod_net

  web:
    build:
      context: ./apps/mission-control
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - geevheit_prod_net

  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geevheit_intelligence_prod}
      POSTGRES_USER: ${POSTGRES_USER:-geevheit_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geevheit_prod_secret_pass_123!}
      DB_HOST: postgres
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - backup_prod_data:/backups
      - ./infra/scripts/backup_postgres.sh:/usr/local/bin/backup_postgres.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "$${BACKUP_SCHEDULE:-0 3 * * *} /bin/sh /usr/local/bin/backup_postgres.sh >> /var/log/cron.log 2>&1" > /etc/crontabs/root
        echo "[INFO] Agendamento de backup diário configurado para: $${BACKUP_SCHEDULE:-0 3 * * *}"
        crond -f -l 2
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - geevheit_prod_net

volumes:
  postgres_prod_data:
  redis_prod_data:
  backup_prod_data:

networks:
  geevheit_prod_net:
    driver: bridge


openapi: 3.1.0
info:
  title: Geevheit Intelligence 360 API
  version: 0.1.0
  description: API-first contract for the enterprise transportation intelligence platform.
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: API is running
  /api/v1/login:
    post:
      summary: Authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials
  /api/v1/refresh:
    post:
      summary: Rotate refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New authentication tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
  /api/v1/logout:
    post:
      summary: Revoke current session refresh tokens
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out
  /api/v1/me:
    get:
      summary: Current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /api/v1/users:
    get:
      summary: List users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Users
    post:
      summary: Create user
      security:
        - bearerAuth: []
      responses:
        "201":
          description: User created
  /api/v1/ciot:
    get:
      summary: List CIOT records
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: per_page
          schema:
            type: integer
      responses:
        "200":
          description: CIOT page
    post:
      summary: Create CIOT draft
      security:
        - bearerAuth: []
      responses:
        "201":
          description: CIOT created
  /api/v1/ciot/{id}:
    get:
      summary: Get CIOT
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: CIOT
    patch:
      summary: Update editable CIOT data
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: CIOT updated
    delete:
      summary: Soft delete non-finalized CIOT
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "204":
          description: CIOT deleted
  /api/v1/ciot/{id}/history:
    get:
      summary: List append-only CIOT lifecycle history
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: CIOT history
  /api/v1/ciot/{id}/activate:
    post:
      summary: Activate generated CIOT
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: CIOT activated
  /api/v1/ciot/{id}/suspend:
    post:
      summary: Suspend active CIOT
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: CIOT suspended
  /api/v1/ciot/{id}/reactivate:
    post:
      summary: Reactivate suspended CIOT
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: CIOT reactivated
  /api/v1/ciot/{id}/close:
    post:
      summary: Close active CIOT
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: CIOT closed
  /api/v1/ciot/{id}/cancel:

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
    ItemID:
      name: item_id
      in: path
      required: true
      schema:
        type: string
    InspectionID:
      name: inspection_id
      in: path
      required: true
      schema:
        type: string
    Search:
      name: search
      in: query
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        default: 20
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        tenant_id:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    AuthResult:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        email:
          type: string
        status:
          type: string
    Asset:
      type: object
      required: [internal_code, asset_tag, name]
      properties:
        id:
          type: string
        tenant_id:
          type: string
        internal_code:
          type: string
        serial_number:
          type: string
        asset_tag:
          type: string
        name:
          type: string
        category_id:
          type: string
        type_id:
          type: string
        status:
          type: string
        ownership:
          type: string
    Vehicle:
      type: object
      required: [license_plate, renavam, chassis]
      properties:
        id:
          type: string
        tenant_id:
          type: string
        category_id:
          type: string
        type_id:
          type: string
        brand_id:
          type: string
        model_id:
          type: string
        asset_id:
          type: string
        license_plate:
          type: string
        renavam:
          type: string
        chassis:
          type: string
        ownership_type:
          type: string
        status:
          type: string
    Checklist:
      type: object
      required: [vehicle_id, title]
      properties:
        id:
          type: string
        tenant_id:
          type: string
        vehicle_id:
          type: string
        title:
          type: string
        description:
          type: string
        type:
          type: string
        status:
          type: string
    ChecklistItem:
      type: object
      required: [title]
      properties:
        id:
          type: string
        checklist_id:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
        required:
          type: boolean
        order_index:
          type: integer
        answer_type:
          type: string
        expected_value:
          type: string
    ChecklistAnswer:
      type: object
      required: [checklist_item_id]
      properties:
        id:
          type: string
        checklist_item_id:
          type: string
        answer:
          type: string
        notes:
          type: string
        photo_url:
          type: string
    Tire:
      type: object
      required: [serial_number, fire_number, dot]
      properties:
        id:
          type: string
        tenant_id:
          type: string
        serial_number:
          type: string
        fire_number:
          type: string
        brand:
          type: string
        model:
          type: string
        size:
          type: string
        dot:
          type: string
        current_tread_mm:
          type: number
        original_tread_mm:
          type: number
        minimum_tread_mm:
          type: number
        status:
          type: string
        vehicle_id:
          type: string
        position:
          type: string
    WorkOrder:
      type: object
      required: [title]
      properties:
        id:
          type: string
        tenant_id:
          type: string
        code:
          type: string
        asset_id:
          type: string
        vehicle_id:
          type: string
        title:
          type: string
        description:
          type: string
        kind:
          type: string
        status:
          type: string
        priority:
          type: string
        category_id:
          type: string
        workshop_id:
          type: string
        technician_id:
          type: string
        reason_id:
          type: string
        service_type_id:
          type: string

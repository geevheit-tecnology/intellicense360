openapi: 3.1.0
info:
  title: Geevheit Intelligence 360 API
  version: 0.1.0
  description: API-first contract for the enterprise transportation intelligence platform.
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: API is running
  /api/v1/login:
    post:
      summary: Authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials
  /api/v1/refresh:
    post:
      summary: Rotate refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New authentication tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
  /api/v1/logout:
    post:
      summary: Revoke current session refresh tokens
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out
  /api/v1/me:
    get:
      summary: Current authenticated user
      security:
